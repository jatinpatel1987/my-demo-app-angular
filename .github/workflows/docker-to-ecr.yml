name: Docker Hub to AWS ECR

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  push-to-ecr:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker Hub Image
        run: docker pull jatinpatel1987/my-angular-app:latest

      - name: Tag Docker Image
        run: |
          docker tag jatinpatel1987/my-angular-app:latest \
          ${{ steps.login-ecr.outputs.registry }}/my-angular-app:latest

      - name: Push Image to ECR
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/myapp:latest